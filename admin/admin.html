<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin – Smart City Parking</title>

    <!-- ✅ YOUR CSS FIRST (important) -->
    <link rel="stylesheet" href="/admin/admim.css">

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet Draw -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
</head>

<body>

<header>
    <h2>🛠️ Admin Panel – Parking Management</h2>
    <p id="selectedArea">Selected Area ID: none</p>
</header>

<div id="map"></div>

<div id="form">
    <h3>Parking Area</h3>

    <input id="name" placeholder="Parking name" />

    <select id="type">
        <option value="public">Public</option>
        <option value="private">Private</option>
        <option value="disabled">Disabled</option>
    </select>

    <input id="capacity" type="number" placeholder="Total capacity" />
    <input id="available" type="number" placeholder="Available spaces" />
    <input id="price" type="number" placeholder="Price per hour" />

    <button onclick="saveParking()">💾 Save Parking Area</button>
    <button onclick="deleteParking()">🗑️ Delete Parking Area</button>

    <hr>

    <h3>Parking Spot</h3>
    <p style="font-size: 0.9em; color: #555;">
        1️⃣ Select a parking area<br>
        2️⃣ Click marker tool 📍<br>
        3️⃣ Click map to place spot
    </p>

    <button onclick="saveParkingSpot()">📍 Save Parking Spot</button>
</div>

<!-- JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="/admin/admin.js"></script>

</body>
</html>
